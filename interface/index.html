<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Strict CSP (GitHub Pages cannot set response headers, so this meta policy
      is the document policy):
        - scripts only from this origin (the theme bootstrap is an external
          same-origin file, so no `'unsafe-inline'` is required),
        - inline styles allowed for Tailwind/React runtime + TON Connect UI,
        - images from same-origin, data:/blob: and ANY HTTPS host, because
          `wallets-list-v2.json` serves wallet icons from dozens of independent
          CDNs (tonkeeper.com, tonhub.com, static.okx.com, config.ton.org,
          raw.githubusercontent.com, ...). An allow-list here leaves blank
          squares in the TON Connect wallet modal,
        - network calls restricted to this origin plus HTTPS/WSS, because every
          TON Connect wallet registers its OWN bridge (`bridge.tonapi.io`,
          `bridge.ton.space`, `connect.tonhubapi.com`,
          `tonconnectbridge.mytonwallet.org`, `sse-bridge.hot-labs.org`, ...)
          as well as the remote wallets list at `https://config.ton.org`. A
          host allow-list blocks the SSE bridge, so "Connect" hangs forever.
        - `form-action 'self'`: Telegram wallets return into the Mini App
          without posting cross-origin forms.
      `frame-ancestors` is intentionally omitted: browsers ignore it in a meta
      tag and Telegram must be able to frame the Mini App.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="FRO4A — a wallet-first, mathematically closed pari-mutuel lottery on TON with Soulbound NFT tickets and ed25519 VRF fairness."
    />
    <meta name="theme-color" content="#EEF1F5" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./tonconnect-icon.png" />
    <title>FRO4A</title>
    <!-- Apply the persisted session-only theme before the first paint. -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
