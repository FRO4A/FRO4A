name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # The tunnel script commits this file on every restart: it must never
    # trigger a rebuild (that would overwrite the fresh endpoint with a stale
    # copy). Raw GitHub serves the new value immediately.
    #
    # NOTE: GitHub forbids combining `paths` with `paths-ignore` for the same
    # event, so this workflow is filtered by exclusion only.
    paths-ignore:
      - 'interface/public/runtime-config.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Supply-chain hardening: every action is pinned to the full 40-character
      # commit SHA of an official release. A retargeted tag (or a compromised
      # upstream account moving `vX`) can therefore never change what runs in
      # this privileged workflow. The trailing `# vX.Y.Z` is informational and
      # must be updated together with the SHA.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The build only reads the repo: never persist the job token in
          # .git/config, where a compromised dependency could steal it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'interface/package-lock.json'

      - name: Install dependencies
        working-directory: interface
        run: npm ci

      - name: Build interface
        working-directory: interface
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          # The repository starts without GitHub Pages enabled; the job token
          # (pages: write) bootstraps the "GitHub Actions" publishing source.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'interface/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # `actions/deploy-pages` is the only step using the `pages` environment:
        # pinning it to a commit SHA keeps the OIDC `id-token` out of reach of
        # a mutated tag.
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
